demo_mode: ${oc.env:SMART_DATA_QUERYING_AGENT_DEMO_MODE,false}
local_mode: ${oc.env:SMART_DATA_QUERYING_AGENT_LOCAL_MODE,true}
local_data_dir: ${oc.env:SMART_DATA_QUERYING_AGENT_LOCAL_DATA_DIR,.local-data}

logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: ${oc.env:DB_META_HOST,localhost}
  port: ${oc.env:DB_META_PORT,3306}
  user: ${oc.env:DB_META_USER,smart-data-querying-agent}
  password: ${oc.env:DB_META_PASSWORD,123456}
  database: ${oc.env:DB_META_DATABASE,meta}

db_dw:
  host: ${oc.env:DB_DW_HOST,localhost}
  port: ${oc.env:DB_DW_PORT,3306}
  user: ${oc.env:DB_DW_USER,smart-data-querying-agent}
  password: ${oc.env:DB_DW_PASSWORD,123456}
  database: ${oc.env:DB_DW_DATABASE,dw}

qdrant:
  host: 127.0.0.1
  port: 6333
  embedding_size: 1024

embedding:
  host: 127.0.0.1
  port: 8081
  model: BAAI/bge-large-zh-v1.5
  model_path: ${oc.env:EMBEDDING_MODEL_PATH,docker/embedding/bge-large-zh-v1.5}

es:
  host: 127.0.0.1
  port: 9200
  index_name: data_agent

llm:
  model_name: ${oc.env:LLM_MODEL_NAME,deepseek-v4-flash}
  api_key: ${oc.env:LLM_API_KEY,""}
  base_url: ${oc.env:LLM_BASE_URL,""}
